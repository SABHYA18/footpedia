server:
  # Railway (and most PaaS hosts) assign the listen port dynamically via $PORT.
  port: ${PORT:8080}

spring:
  application:
    name: footpedia

  config:
    # Loads .env (working-directory-relative) as properties, so the values
    # placeholder'd below (${DB_HOST:...} etc.) resolve without exporting
    # them into the shell first. Optional: absent in prod, where real env
    # vars are set instead.
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:footpedia}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:footpedia}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Liquibase owns the schema, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty default preserves the local no-auth Redis used in dev; a managed
      # Redis (Railway's plugin, etc.) needs this set.
      password: ${REDIS_PASSWORD:}


  task:
    scheduling:
      pool:
        # Spring's default is a single shared thread for every @Scheduled method --
        # a slow football-data.org sync (minutes, observed in practice) would then
        # completely block the reminder poller for that whole window, arbitrarily
        # delaying "before kickoff" notifications. One thread per scheduled job
        # family so they can't starve each other. 7 methods currently:
        # LeagueIngestionScheduler (x2), HistoricalIngestionScheduler,
        # ReminderDueScheduler, EspnLiveScoreScheduler, EspnMatchDetailScheduler,
        # EspnHistoricalBackfillScheduler. Bump this again if another lands.
        size: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

resilience4j:
  ratelimiter:
    instances:
      football-data:
        # Mirrors footpedia.providers.football-data.requests-per-minute below.
        limit-for-period: 10
        limit-refresh-period: 1m
        # 5 competitions x 2 calls/cycle = 10 calls, exactly one window's
        # worth. 70s (> the 1m refresh period) lets a cycle that doesn't
        # fully fit in the current window's permits queue for the next
        # window instead of erroring out.
        timeout-duration: 70s
      # Split from one shared "espn" bucket: live scoreboard polling (every
      # 30s, up to 5 leagues) was found to consume nearly the entire shared
      # budget by itself, starving summary calls -- observed live, 56
      # scoreboard calls against 1 summary call in a 15-minute window,
      # stalling the historical backfill. Separate buckets guarantee each
      # its own throughput regardless of how busy the other is.
      espn-scoreboard:
        limit-for-period: 12
        limit-refresh-period: 1m
        timeout-duration: 70s
      espn-summary:
        limit-for-period: 15
        limit-refresh-period: 1m
        timeout-duration: 70s

footpedia:
  providers:
    football-data:
      base-url: https://api.football-data.org/v4
      api-key: ${FOOTBALL_DATA_API_KEY:}
      # 10 req/min, no daily cap -> the workhorse for fixtures/standings/scorers
      requests-per-minute: 10
    api-football:
      base-url: https://v3.football.api-sports.io
      api-key: ${API_FOOTBALL_API_KEY:}
      # 100 req/DAY. Spent only on lazy player/match detail, never on polling.
      requests-per-day: 100
      requests-per-minute: 10
      # Stop lazy fetches once this much of the daily budget is gone, so a
      # burst of page views can never starve the evening's live fixtures.
      reserve-threshold: 15
    espn:
      # Unofficial site API behind ESPN's own apps -- no key, no documented
      # rate limit, no daily cap. Fills the gap football-data.org's free
      # tier leaves: live status/score, lineups, match events, team stats.
      # Actual per-minute limits live under resilience4j.ratelimiter above
      # (espn-scoreboard / espn-summary, split so one can't starve the other).
      base-url: https://site.api.espn.com/apis/site/v2/sports/soccer

  resend:
    # HTTPS email API -- Railway blocks outbound SMTP on the standard ports,
    # so direct SMTP to Gmail hung until timeout and never delivered. See
    # EmailServiceImpl.
    base-url: https://api.resend.com
    api-key: ${RESEND_API_KEY:}

  # Cache TTLs derived from how fast each thing actually changes.
  cache-ttl:
    live-score: 30s
    todays-fixtures: 5m
    fixture-list: 1h
    standings: 1h
    player-season-stats: 12h
    transfers: 24h
    historical-fixture: 30d

  # How stale player data may get before a lazy re-fetch is allowed.
  staleness:
    player-stats: 7d

  reminders:
    # Default lead time before kickoff.
    default-lead-time: 1h
    # ZSET the scheduler polls.
    zset-key: footpedia:reminders
    poll-interval: 30s

  jwt:
    # HS256 needs >= 32 bytes. The default is dev-only -- override in prod.
    secret: ${JWT_SECRET:dev-only-change-me-please-32bytesmin-000000}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    # Where the reset link points.
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    reset-token-expiry-minutes: 30
    change-code-expiry-minutes: 10

  cors:
    # footpedia-fe's dev server (Vite default port). Override for prod.
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    com.footpedia: DEBUG
