databaseChangeLog:

  - changeSet:
      id: 010-password-reset-token
      author: sabhya
      changes:
        - createTable:
            tableName: password_reset_token
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true}}
              - column: {name: user_id, type: BIGINT, constraints: {nullable: false}}
              # SHA-256 hash of the token -- the raw token is only ever in the
              # email link, never persisted.
              - column: {name: token_hash, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: expires_at, type: "DATETIME(3)", constraints: {nullable: false}}
              - column: {name: used_at, type: "DATETIME(3)"}
              - column: {name: created_at, type: "DATETIME(3)", constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: password_reset_token
            columnNames: token_hash
            constraintName: uk_password_reset_token_hash
        - addForeignKeyConstraint:
            baseTableName: password_reset_token
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_password_reset_token_user
        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_token_user
            columns:
              - column: {name: user_id}
