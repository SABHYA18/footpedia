databaseChangeLog:

  - changeSet:
      id: 014-password-change-code
      author: sabhya
      changes:
        - createTable:
            tableName: password_change_code
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true}}
              - column: {name: user_id, type: BIGINT, constraints: {nullable: false}}
              # SHA-256 hash of the 6-digit code -- the raw code is only ever in the email.
              - column: {name: code_hash, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: expires_at, type: "DATETIME(3)", constraints: {nullable: false}}
              - column: {name: used_at, type: "DATETIME(3)"}
              - column: {name: created_at, type: "DATETIME(3)", constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: password_change_code
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_password_change_code_user
        - createIndex:
            tableName: password_change_code
            indexName: idx_password_change_code_user
            columns:
              - column: {name: user_id}
